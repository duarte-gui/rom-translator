[project]
name = "romtrans"
version = "0.1.0"
description = "Pipeline generico de traducao de ROMs: extrai, traduz com LLM, reinsere e gera patch"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
romtrans = "romtrans.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["romtrans*"]
